<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Подать заявку — Mlay 2026</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Onest:wght@400;500;600&display=swap"><link rel="stylesheet" href="style.css"></head><body data-page="apply"><main><h2>Подать заявку</h2><div id="authbox"></div><form id="form" hidden><label>Название карты<input name="name" required maxlength="200" placeholder="Текст-заглушка"></label><div class="row"><label>Автор или команда<input name="author" required maxlength="200"></label><label>Версия игры<input name="version" maxlength="50" placeholder="1.20.4"></label></div><div class="row"><label>Ссылка на карту<input name="link" type="url" required maxlength="500"></label><label>Дата выхода<input name="date" type="date"></label></div><fieldset id="formNoms"><legend>Номинации</legend></fieldset><label>Ссылки на скриншоты или трейлер<textarea name="media" maxlength="2000"></textarea></label><label>Описание карты<textarea name="desc" maxlength="2000"></textarea></label><label>Контакты (Discord или Telegram)<input name="contact" required maxlength="200"></label><div><button class="btn" type="submit">Отправить заявку</button></div><p id="msg" class="msg" role="status"></p></form></main><script type="module" src="app.js"></script></body></html>
