<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Подать заявку — Mlay 2026</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Onest:wght@400;500;600&display=swap"><link rel="stylesheet" href="style.css"></head><body data-page="apply"><main><h2>Подать заявку</h2><form id="form"><label>Название карты<input required placeholder="Текст-заглушка"></label><div class="row"><label>Автор или команда<input required></label><label>Версия игры<input placeholder="1.20.4"></label></div><div class="row"><label>Ссылка на карту<input type="url" required></label><label>Дата выхода<input type="date"></label></div><fieldset id="formNoms"><legend>Номинации</legend></fieldset><label>Ссылки на скриншоты или трейлер<textarea></textarea></label><label>Описание карты<textarea></textarea></label><label>Контакты (Discord или Telegram)<input required></label><div><button class="btn" type="submit">Отправить заявку</button></div></form></main><script src="app.js"></script></body></html>
